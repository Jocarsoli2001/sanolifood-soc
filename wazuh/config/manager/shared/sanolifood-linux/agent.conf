<!-- Centralized policy for the Ubuntu corporate endpoint. -->
<agent_config>
  <labels>
    <label key="sf.asset.organization">SanoliFood-SA</label>
    <label key="sf.asset.zone">corporate</label>
    <label key="sf.asset.platform">linux</label>
    <label key="sf.telemetry.profile">endpoint-v1</label>
  </labels>

  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
    <directories check_all="yes" realtime="yes" whodata="yes" report_changes="yes">/etc/sanolifood</directories>
    <directories check_all="yes" realtime="yes" whodata="yes">/etc/ssh/sshd_config</directories>
    <ignore type="sregex">.swp$|.tmp$|~$</ignore>
    <skip_nfs>yes</skip_nfs>
    <process_priority>10</process_priority>
    <max_eps>50</max_eps>
  </syscheck>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>
</agent_config>
