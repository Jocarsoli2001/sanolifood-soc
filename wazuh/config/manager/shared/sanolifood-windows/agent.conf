<!-- Centralized policy for the Windows corporate endpoint. -->
<agent_config>
  <labels>
    <label key="sf.asset.organization">SanoliFood-SA</label>
    <label key="sf.asset.zone">corporate</label>
    <label key="sf.asset.platform">windows</label>
    <label key="sf.telemetry.profile">endpoint-v1</label>
  </labels>

  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
    <directories check_all="yes" realtime="yes" whodata="yes" report_changes="yes">C:\SanoliFood\Quality\Config</directories>
    <directories check_all="yes" realtime="yes" whodata="yes">C:\ProgramData\ssh\sshd_config</directories>
    <ignore type="sregex">.tmp$|.bak$|~$</ignore>
    <process_priority>10</process_priority>
    <max_eps>100</max_eps>
  </syscheck>

  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>OpenSSH/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
</agent_config>
