name: sanolifood-soar

services:
  soar-db:
    image: postgres:17.6-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
      SOAR_DB_PASSWORD: ${SOAR_DB_PASSWORD}
      TZ: UTC
    volumes:
      - soar_db_data:/var/lib/postgresql/data
      - ./config/init-soar-db.sh:/docker-entrypoint-initdb.d/10-init-soar-db.sh:ro
    networks:
      - sanoli_soar_backend
    healthcheck:
      # During first initialization PostgreSQL temporarily accepts Unix-socket
      # connections before the final TCP listener exists. The controller uses
      # TCP, so readiness must validate that same path and avoid a startup race.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U n8n -d n8n"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    shm_size: 128mb
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  soar-controller:
    image: sanolifood/app:0.7.0
    restart: unless-stopped
    env_file:
      - ./runtime/.env
    environment:
      RUN_MIGRATIONS: "false"
      RUN_SCHEMA_CHECK: "false"
      RUN_BOOTSTRAP: "false"
      RUN_DEMO_SEED: "false"
      SOAR_DATABASE_URL: postgresql+psycopg://soar_app:${SOAR_DB_PASSWORD}@soar-db:5432/soar
      SOAR_APP_URL: http://app:8000
      SOAR_EVIDENCE_DIR: /var/lib/sanolifood-soar/evidence
      SOAR_PLAYBOOK_CATALOG: /app/src/sanolifood/soar/playbooks.json
    command:
      - uvicorn
      - sanolifood.soar.controller:app
      - --host
      - 0.0.0.0
      - --port
      - "5680"
      - --no-access-log
    depends_on:
      soar-db:
        condition: service_healthy
      soar-evidence-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${SOAR_CONTROLLER_PORT:-5680}:5680/tcp"
    volumes:
      - soar_evidence:/var/lib/sanolifood-soar/evidence
    networks:
      - sanoli_soar_backend
      - sanoli_app
      # Docker Engine 29.x can discard published ports when every attached
      # bridge is internal. This dedicated bridge carries only host-loopback
      # publication; application traffic still uses the private networks.
      - sanoli_soar_host
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5680/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  soar-evidence-init:
    image: sanolifood/app:0.7.0
    restart: "no"
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - install -d -o 10001 -g 10001 -m 0750 /var/lib/sanolifood-soar/evidence
    volumes:
      - soar_evidence:/var/lib/sanolifood-soar/evidence
    network_mode: none
    security_opt:
      - no-new-privileges:true
    read_only: true
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.36.7}
    restart: unless-stopped
    depends_on:
      soar-db:
        condition: service_healthy
      soar-controller:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: soar-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST:-127.0.0.1}
      # N8N_HOST is the advertised editor host. The process must listen on the
      # container interface so Docker can forward the loopback-only host port.
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://${N8N_HOST:-127.0.0.1}:${SOAR_PUBLIC_PORT:-5678}
      WEBHOOK_URL: http://n8n:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_RUNNERS_MODE: internal
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_LOG_LEVEL: info
      N8N_LOG_OUTPUT: console
      N8N_PAYLOAD_SIZE_MAX: 3
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 10000
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      SOAR_WEBHOOK_SECRET: ${SOAR_WEBHOOK_SECRET}
      SOAR_ANALYST_SECRET: ${SOAR_ANALYST_SECRET}
      SOAR_INTERNAL_TOKEN: ${SOAR_INTERNAL_TOKEN}
    ports:
      - "${SOAR_BIND_ADDRESS:-127.0.0.1}:${SOAR_PUBLIC_PORT:-5678}:5678/tcp"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/opt/sanolifood/workflows:ro
    networks:
      - sanoli_soar
      - sanoli_soar_backend
      - sanoli_soar_host
    healthcheck:
      test:
        - CMD
        - node
        - -e
        # Resolve the service alias to a container interface. A process bound
        # only to container loopback must not be reported as healthy.
        - "fetch('http://n8n:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    mem_limit: 1024m
    cpus: 1.5
    pids_limit: 512
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

networks:
  sanoli_soar:
    external: true
    name: sanoli_soar
  sanoli_soar_backend:
    name: sanoli_soar_backend
    internal: true
  sanoli_app:
    external: true
    name: sanoli_app
  sanoli_soar_host:
    name: sanoli_soar_host
    driver: bridge
    internal: false
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"

volumes:
  n8n_data:
    name: sanolifood_n8n_data
  soar_db_data:
    name: sanolifood_soar_db_data
  soar_evidence:
    name: sanolifood_soar_evidence
