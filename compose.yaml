name: sanolifood

services:
  postgres:
    image: postgres:17.6-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${APP_TIMEZONE:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sanoli_data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    shm_size: 128mb

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: sanolifood/app:0.1.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sanoli_app
      - sanoli_data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  nginx:
    image: nginx:1.28.0-alpine3.21
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${PUBLIC_HTTP_PORT:-8080}:8080"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sanoli_dmz
      - sanoli_app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/nginx-health >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=8m,mode=0755
      - /tmp:size=16m,mode=1777

networks:
  sanoli_dmz:
    name: sanoli_dmz
  sanoli_app:
    name: sanoli_app
    internal: true
  sanoli_data:
    name: sanoli_data
    internal: true

volumes:
  postgres_data:
    name: sanolifood_postgres_data

